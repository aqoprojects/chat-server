[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app", "core", "db", "cache", "services", "workers", "schemas"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=app --cov=core --cov=services --cov-report=term-missing"
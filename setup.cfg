[flake8]
max-line-length = 88
extend-ignore = E203, W503, E501
exclude =
    .venv,
    .git,
    __pycache__,
    alembic/versions,
    build,
    dist
per-file-ignores =
    # __init__.py files re-export names — F401 (imported but unused) is expected
    */__init__.py:F401
    # Test files use assert statements freely — S101 is expected
    tests/*:S101
